<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Sivels Finance</title>

    <!-- Preconnect + preload the font stylesheet so text paints without FOUT/flicker -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Critical inline styles: paint background on first frame, no white flash -->
    <style>
      html, body { margin: 0; background-color: #f8fafc; }
      #root { min-height: 100vh; }
      /* Suppress transitions during first paint to avoid mount flicker */
      body.preload * { transition: none !important; }
    </style>
  </head>
  <body class="preload">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      /* Remove the transition guard once the first frame is committed */
      window.addEventListener('load', function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.body.classList.remove('preload');
          });
        });
      });
    </script>
  </body>
</html>
